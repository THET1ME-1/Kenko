name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=/usr/lib/android-sdk" > local.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

name: Release

# Собирает подписанные APK и выкладывает релиз, когда появляется тег вида v1.5.0.
# Ключ подписи живёт в секретах репозитория: в дереве его нет и быть не должно.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для ручного запуска, например 1.5.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4

      - name: Поставить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Разложить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kenko-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/kenko-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Прогнать тесты
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Собрать релизные APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Назвать файлы по-человечески
        id: rename
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          mkdir -p release
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            [ -f "$src" ] || { echo "нет файла $src"; exit 1; }
            cp "$src" "release/Kenko-$VERSION-$abi.apk"
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la release

      - name: Достать заметки к версии
        id: notes
        run: |
          set -eu
          NOTES="$(bash changelog.sh "${{ steps.rename.outputs.version }}" || true)"
          if [ -z "$NOTES" ]; then
            NOTES="Версия ${{ steps.rename.outputs.version }}"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kenko ${{ steps.rename.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: release/*.apk
